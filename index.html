<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Domino - NACIM BOURARA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- الشريط العلوي -->
        <header class="header">
            <div class="logo">⚡ CYBER DOMINO</div>
            <div id="game-status" class="status">دور اللاعب 1 (أنت)</div>
            <div class="dev">By NACIM BOURARA</div>
        </header>

        <!-- طاولة اللعب -->
        <div class="board-area" id="board-area">
            <div class="board-placeholder">الطاولة فارغة، العب أول قطعة!</div>
        </div>

        <!-- معلومات الطاولة والبنك -->
        <div class="table-info">
            <span id="p1-score">قطعك: 7</span> | 
            <span id="p2-score">قطع الخصم: 7</span> | 
            <button id="draw-btn" onclick="drawTile()">سحب من البنك 📥</button>
        </div>

        <!-- يد اللاعب الحالي -->
        <div class="player-hand-section">
            <div class="section-title" id="hand-title">قطعك (اختر للعب):</div>
            <div class="hand-tiles" id="player-hand"></div>
        </div>

        <!-- نظام الدردشة والحوار الحقيقي -->
        <div class="chat-section">
            <div class="chat-messages" id="chat-box">
                <div class="msg system">مرحباً بكما! اكتب رسالتك لصديقك في الأسفل...</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="اكتب رسالة هنا..." maxlength="40">
                <button id="send-btn" onclick="sendCustomMessage()">إرسال 💬</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
